# ============================================================================
# OpenTune CI Build & Release Workflow
# ============================================================================
# Builds OpenTune on Windows (VS2022 x64) and macOS (Apple Silicon arm64).
# On version tags (v*), also creates a GitHub Release with packaged downloads.
# ============================================================================

name: Build & Release OpenTune

on:
  push:
    branches: [main, master, standalone]
    tags: ["v*"]
  pull_request:
    branches: [main, master, standalone]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a release after building"
        type: boolean
        default: false
        required: false

env:
  # Version pins — bump these when updating deps
  ONNXRUNTIME_VERSION: "1.24.4"
  ARA_SDK_VERSION: "2.2.0"
  DIRECTML_VERSION: "1.15.4"
  D3D12_VERSION: "1.619.1"
  SOUNDTOUCH_VERSION: "2.3.3"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Windows Build (VS2022, x64)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    # Must use windows-2022 — CMakePresets.json uses "Visual Studio 17 2022" generator
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # ── Extract version ──────────────────────────────────────────────────
      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          # Prefer tag; fall back to CMakeLists.txt project version
          if ("$env:GITHUB_REF" -match "^refs/tags/v(.+)$") {
            $ver = $matches[1]
          } else {
            $cmake = Get-Content CMakeLists.txt
            if ($cmake -match 'project\(OpenTune VERSION ([0-9.]+)') {
              $ver = $matches[1]
            } else {
              $ver = "0.0.0"
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Building OpenTune v$ver"

      # ── Setup ────────────────────────────────────────────────────────────
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Cache ────────────────────────────────────────────────────────────
      - name: Cache ThirdParty dependencies
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: |
            JUCE-master
            ThirdParty/ARA_SDK-releases-*
            ThirdParty/onnxruntime-win-x64-*
            ThirdParty/onnxruntime-dml-*
            ThirdParty/microsoft.ai.directml.*
            ThirdParty/microsoft.direct3d.d3d12.*
            ThirdParty/soundtouch-*
          key: deps-windows-${{ env.ONNXRUNTIME_VERSION }}-${{ env.ARA_SDK_VERSION }}-${{ env.DIRECTML_VERSION }}-${{ env.D3D12_VERSION }}-${{ env.SOUNDTOUCH_VERSION }}-${{ hashFiles('cmake/OpenTuneJuceVST3ClientOverlay.cmake') }}

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Download JUCE Framework
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          if (-not (Test-Path "JUCE-master")) {
            git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE-master
          }

      - name: Download ARA SDK
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $araDir = "ThirdParty/ARA_SDK-releases-$env:ARA_SDK_VERSION"
          if (-not (Test-Path $araDir)) {
            # releases/2.2.0 tag has outdated ARA_Library submodule lacking
            # Utilities/ARAChannelFormat.cpp required by JUCE — use main branch
            git clone --recursive --depth 1 https://github.com/Celemony/ARA_SDK.git $araDir
          }

      - name: Download ONNX Runtime CPU
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $dir = "ThirdParty/onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION"
          if (-not (Test-Path "$dir/include/onnxruntime_cxx_api.h")) {
            $zip = "onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION.zip"
            $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ONNXRUNTIME_VERSION/$zip"
            Write-Host "Downloading ONNX Runtime CPU from $url"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath ThirdParty/ -Force
            Remove-Item $zip
          }

      - name: Download ONNX Runtime DirectML (NuGet)
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $dir = "ThirdParty/onnxruntime-dml-$env:ONNXRUNTIME_VERSION"
          if (-not (Test-Path "$dir/runtimes/win-x64/native/onnxruntime.dll")) {
            $nupkg = "Microsoft.ML.OnnxRuntime.DirectML.$env:ONNXRUNTIME_VERSION.nupkg"
            $url = "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$env:ONNXRUNTIME_VERSION"
            Write-Host "Downloading ONNX Runtime DML from $url"
            Invoke-WebRequest -Uri $url -OutFile "$nupkg.zip"
            New-Item -ItemType Directory -Force -Path $dir
            Expand-Archive -Path "$nupkg.zip" -DestinationPath $dir -Force
            Remove-Item "$nupkg.zip"
          }

      - name: Download DirectML SDK
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $dir = "ThirdParty/microsoft.ai.directml.$env:DIRECTML_VERSION"
          if (-not (Test-Path "$dir/include/DirectML.h")) {
            $url = "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$env:DIRECTML_VERSION"
            Invoke-WebRequest -Uri $url -OutFile "$dir.zip"
            New-Item -ItemType Directory -Force -Path $dir
            Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
            Remove-Item "$dir.zip"
          }

      - name: Download D3D12 Agility SDK
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $dir = "ThirdParty/microsoft.direct3d.d3d12.$env:D3D12_VERSION"
          if (-not (Test-Path "$dir/build/native/include/d3d12.h")) {
            $url = "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$env:D3D12_VERSION"
            Invoke-WebRequest -Uri $url -OutFile "$dir.zip"
            New-Item -ItemType Directory -Force -Path $dir
            Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
            Remove-Item "$dir.zip"
          }

      # SoundTouch Library (WSOLA time-stretch, LGPL-2.1)
      - name: Download SoundTouch
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          $dir = "ThirdParty/soundtouch-$env:SOUNDTOUCH_VERSION"
          if (-not (Test-Path "$dir/source/SoundTouch/SoundTouch.cpp")) {
            $url = "https://www.surina.net/soundtouch/soundtouch-$env:SOUNDTOUCH_VERSION.tar.gz"
            Write-Host "Downloading SoundTouch from $url"
            $tarball = "soundtouch-$env:SOUNDTOUCH_VERSION.tar.gz"
            # Use curl.exe with retry (more reliable than Invoke-WebRequest on Windows)
            curl.exe -sSL --connect-timeout 30 --retry 3 $url -o $tarball
            if (-not (Test-Path $tarball)) {
              # Fallback: try GitHub mirror
              Write-Host "Retrying via GitHub mirror..."
              $url = "https://github.com/olegantonyan/soundtouch/archive/refs/tags/v$env:SOUNDTOUCH_VERSION.tar.gz"
              curl.exe -sSL --connect-timeout 30 --retry 3 $url -o $tarball
            }
            tar xzf $tarball -C ThirdParty/
            # Tarball extracts to "soundtouch/" — rename to match CMakeLists.txt expectation
            if (Test-Path "ThirdParty/soundtouch") {
              Remove-Item -Recurse -Force "ThirdParty/soundtouch-$env:SOUNDTOUCH_VERSION" -ErrorAction SilentlyContinue
              Rename-Item -Path "ThirdParty/soundtouch" -NewName "soundtouch-$env:SOUNDTOUCH_VERSION"
            }
            Remove-Item $tarball
            Write-Host "SoundTouch extracted to $dir"
          }

      # ── Download AI Models (optional) ────────────────────────────────────
      - name: Download AI models
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          New-Item -ItemType Directory -Force -Path pc_nsf_hifigan_44.1k_ONNX | Out-Null

          # Try upstream release
          try {
            $upstream = "YuFeng926/OpenTune"
            $releases = Invoke-RestMethod "https://api.github.com/repos/$upstream/releases?per_page=5"
            $tag = $releases[0].tag_name
            $assetList = (Invoke-RestMethod "https://api.github.com/repos/$upstream/releases/tags/$tag").assets
            foreach ($asset in $assetList) {
              if ($asset.name -like "*.onnx") {
                Write-Host "Downloading model: $($asset.name)"
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "models/$($asset.name)"
              }
            }
          } catch {
            Write-Host "Could not fetch models from upstream. Build will proceed without model files."
          }

      # ── Configure ────────────────────────────────────────────────────────
      - name: Configure CMake (ARA)
        run: |
          cmd /v:on /c "set CLEAN_PATH=%Path%& set PATH=& set Path=!CLEAN_PATH!& cmake --preset windows-ara-vs2022 -DOPENTUNE_BUILD_ARCHITECTURE_TESTS=OFF"

      - name: Configure CMake (non-ARA)
        run: |
          cmd /v:on /c "set CLEAN_PATH=%Path%& set PATH=& set Path=!CLEAN_PATH!& cmake --preset windows-nonara-vs2022 -DOPENTUNE_BUILD_ARCHITECTURE_TESTS=OFF"

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build ARA VST3
        run: |
          cmd /v:on /c "set CLEAN_PATH=%Path%& set PATH=& set Path=!CLEAN_PATH!& cmake --build --preset windows-ara-release --target OpenTune_VST3"

      - name: Build ARA Standalone
        run: |
          cmd /v:on /c "set CLEAN_PATH=%Path%& set PATH=& set Path=!CLEAN_PATH!& cmake --build --preset windows-ara-release --target OpenTune_Standalone"

      - name: Build non-ARA VST3
        run: |
          cmd /v:on /c "set CLEAN_PATH=%Path%& set PATH=& set Path=!CLEAN_PATH!& cmake --build --preset windows-nonara-release --target OpenTune_VST3"

      # ── Package for Release ──────────────────────────────────────────────
      - name: Package Windows release artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.get-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist

          # ARA Standalone
          Compress-Archive -Path "build-ara-overlay-vs18-clean/OpenTune_artefacts/Release/Standalone/*" `
            -DestinationPath "dist/OpenTune-$ver-Windows-ARA-Standalone.zip" -Force

          # ARA VST3
          if (Test-Path "build-ara-overlay-vs18-clean/OpenTune_artefacts/Release/VST3/OpenTune.vst3") {
            Compress-Archive -Path "build-ara-overlay-vs18-clean/OpenTune_artefacts/Release/VST3/*" `
              -DestinationPath "dist/OpenTune-$ver-Windows-ARA-VST3.zip" -Force
          }

          # non-ARA VST3
          if (Test-Path "build-nonara-overlay-vs18-clean/OpenTune_artefacts/Release/VST3/OpenTune.vst3") {
            Compress-Archive -Path "build-nonara-overlay-vs18-clean/OpenTune_artefacts/Release/VST3/*" `
              -DestinationPath "dist/OpenTune-$ver-Windows-non-ARA-VST3.zip" -Force
          }

          Write-Host "Packaged release artifacts:"
          Get-ChildItem dist/ | Select-Object Name, Length

      # ── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload debug artifacts (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Windows
          path: |
            build-ara-overlay-vs18-clean/OpenTune_artefacts/Release/
            build-nonara-overlay-vs18-clean/OpenTune_artefacts/Release/
          compression-level: 6

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Windows-Packages
          path: dist/*.zip
          compression-level: 0

  # ──────────────────────────────────────────────────────────────────────────
  # macOS Build (Apple Silicon arm64)
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # ── Extract version ──────────────────────────────────────────────────
      - name: Get version
        id: get-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            ver="${BASH_REMATCH[1]}"
          else
            ver=$(grep -oP 'project\(OpenTune VERSION \K[0-9.]+' CMakeLists.txt || echo "0.0.0")
          fi
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "Building OpenTune v$ver"

      - name: Install CMake
        run: brew install cmake

      # ── Cache ────────────────────────────────────────────────────────────
      - name: Cache ThirdParty dependencies
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: |
            JUCE-master
            ThirdParty/ARA_SDK-releases-*
            ThirdParty/onnxruntime-osx-arm64-*
            ThirdParty/soundtouch-*
          key: deps-macos-${{ env.ONNXRUNTIME_VERSION }}-${{ env.ARA_SDK_VERSION }}-${{ env.SOUNDTOUCH_VERSION }}-${{ hashFiles('cmake/OpenTuneJuceVST3ClientOverlay.cmake') }}

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Download JUCE Framework
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "JUCE-master" ]; then
            git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE-master
          fi

      - name: Download ARA SDK
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          ARA_DIR="ThirdParty/ARA_SDK-releases-${ARA_SDK_VERSION}"
          if [ ! -d "$ARA_DIR" ]; then
            # releases/2.2.0 tag has outdated ARA_Library submodule lacking
            # Utilities/ARAChannelFormat.cpp required by JUCE — use main branch
            git clone --recursive --depth 1 https://github.com/Celemony/ARA_SDK.git "$ARA_DIR"
          fi

      - name: Download ONNX Runtime (macOS arm64)
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          DIR="ThirdParty/onnxruntime-osx-arm64-${ONNXRUNTIME_VERSION}"
          if [ ! -f "$DIR/include/onnxruntime_cxx_api.h" ]; then
            TARBALL="onnxruntime-osx-arm64-${ONNXRUNTIME_VERSION}.tgz"
            URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/${TARBALL}"
            echo "Downloading ONNX Runtime macOS from $URL"
            curl -LO "$URL"
            mkdir -p "$DIR"
            tar xzf "$TARBALL" -C "$DIR" --strip-components=1
            rm "$TARBALL"
          fi

      # SoundTouch Library (WSOLA time-stretch, LGPL-2.1)
      - name: Download SoundTouch
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          DIR="ThirdParty/soundtouch-${SOUNDTOUCH_VERSION}"
          if [ ! -f "$DIR/source/SoundTouch/SoundTouch.cpp" ]; then
            URL="https://www.surina.net/soundtouch/soundtouch-${SOUNDTOUCH_VERSION}.tar.gz"
            echo "Downloading SoundTouch from $URL"
            TARBALL="soundtouch-${SOUNDTOUCH_VERSION}.tar.gz"
            curl -sSL --connect-timeout 30 --retry 3 -o "$TARBALL" "$URL" || {
              # Fallback: GitHub mirror
              echo "Retrying via GitHub mirror..."
              URL="https://github.com/olegantonyan/soundtouch/archive/refs/tags/v${SOUNDTOUCH_VERSION}.tar.gz"
              curl -sSL --connect-timeout 30 --retry 3 -o "$TARBALL" "$URL"
            }
            mkdir -p ThirdParty
            tar xzf "$TARBALL" -C ThirdParty/
            # Tarball extracts to "soundtouch/" — rename to match CMakeLists.txt expectation
            if [ -d "ThirdParty/soundtouch" ]; then
              rm -rf "$DIR" 2>/dev/null || true
              mv "ThirdParty/soundtouch" "$DIR"
            fi
            rm "$TARBALL"
            echo "SoundTouch extracted to $DIR"
          fi

      # ── Download AI Models (optional) ────────────────────────────────────
      - name: Download AI models
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p models pc_nsf_hifigan_44.1k_ONNX
          UPSTREAM="YuFeng926/OpenTune"
          RELEASES=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases?per_page=5")
          TAG=$(echo "$RELEASES" | jq -r '.[0].tag_name // empty')
          if [ -n "$TAG" ]; then
            ASSETS=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases/tags/$TAG" | jq '.assets')
            echo "$ASSETS" | jq -c '.[]' | while read -r asset; do
              NAME=$(echo "$asset" | jq -r '.name')
              DL_URL=$(echo "$asset" | jq -r '.browser_download_url')
              if [[ "$NAME" == *.onnx ]]; then
                echo "Downloading model: $NAME"
                curl -Lo "models/$NAME" "$DL_URL"
              fi
            done
          else
            echo "No upstream releases found. Models need to be provided manually."
          fi

      # ── Configure & Build ────────────────────────────────────────────────
      - name: Configure CMake
        run: cmake -B build -G Xcode -DOPENTUNE_BUILD_ARCHITECTURE_TESTS=OFF

      - name: Build Release
        run: cmake --build build --config Release

      # ── Package for Release ──────────────────────────────────────────────
      - name: Package macOS release artifacts
        shell: bash
        run: |
          VER="${{ steps.get-version.outputs.version }}"
          mkdir -p dist

          # Package Standalone app
          if [ -d "build/OpenTune_artefacts/Release/Standalone/OpenTune.app" ]; then
            ditto -c -k --keepParent "build/OpenTune_artefacts/Release/Standalone/OpenTune.app" \
              "dist/OpenTune-$ver-macOS-Standalone.zip"
          fi

          # Package VST3
          if [ -d "build/OpenTune_artefacts/Release/VST3/OpenTune.vst3" ]; then
            ditto -c -k --keepParent "build/OpenTune_artefacts/Release/VST3/OpenTune.vst3" \
              "dist/OpenTune-$ver-macOS-VST3.zip"
          fi

          echo "Packaged release artifacts:"
          ls -lh dist/

      # ── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload debug artifacts (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-macOS
          path: |
            build/OpenTune_artefacts/Release/
          compression-level: 6

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-macOS-Packages
          path: dist/*.zip
          compression-level: 0

  # ──────────────────────────────────────────────────────────────────────────
  # Release Job — creates GitHub Release and uploads packaged artifacts
  # ──────────────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            ver="${BASH_REMATCH[1]}"
          else
            ver="${{ needs.build-windows.outputs.version }}"
          fi
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "Releasing OpenTune v$ver"

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: OpenTune-Windows-Packages
          path: release-packages/

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: OpenTune-macOS-Packages
          path: release-packages/

      - name: List release packages
        run: ls -lh release-packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenTune v${{ steps.version.outputs.version }}
          body: |
            ## OpenTune v${{ steps.version.outputs.version }}

            ### 下载

            | 平台 | 格式 | 文件 |
            |------|------|------|
            | Windows (ARA) | Standalone | `OpenTune-${{ steps.version.outputs.version }}-Windows-ARA-Standalone.zip` |
            | Windows (ARA) | VST3 | `OpenTune-${{ steps.version.outputs.version }}-Windows-ARA-VST3.zip` |
            | Windows (non-ARA) | VST3 | `OpenTune-${{ steps.version.outputs.version }}-Windows-non-ARA-VST3.zip` |
            | macOS (arm64) | Standalone | `OpenTune-${{ steps.version.outputs.version }}-macOS-Standalone.zip` |
            | macOS (arm64) | VST3 | `OpenTune-${{ steps.version.outputs.version }}-macOS-VST3.zip` |

            ### 使用说明

            **Windows**: 解压后运行 `OpenTune.exe`，保持 `models/` 目录和 DLL 文件在同目录。
            将 `OpenTune.vst3` 文件夹复制到 `C:\Program Files\Common Files\VST3\` 即可在 DAW 中加载。

            **macOS**: 解压后运行 `OpenTune.app`。将 `OpenTune.vst3` 复制到 `/Library/Audio/Plug-Ins/VST3/`。

            > ⚠️ AI 模型文件（onnx）需要单独下载并放入 `models/` 目录。
            > 模型下载地址：[上游 Release](https://github.com/YuFeng926/OpenTune/releases)
          files: release-packages/*
          draft: false
          prerelease: false
          generate_release_notes: false

  # ──────────────────────────────────────────────────────────────────────────
  # Summary Job
  # ──────────────────────────────────────────────────────────────────────────
  ci-summary:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: always()
    steps:
      - name: Summarize build results
        run: |
          echo "## OpenTune CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Build | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Build | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: needs.build-windows.result == 'failure' || needs.build-macos.result == 'failure'
        run: |
          echo "::warning::One or more build jobs failed. Check the workflow logs for details."
